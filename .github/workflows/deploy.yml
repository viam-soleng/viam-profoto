# Publishes the module to the Viam registry when a GitHub Release is published.
# See https://github.com/viamrobotics/build-action for help.
#
# Required repository secrets:
#   VIAM_KEY_ID    - Viam org/location API key ID with permission to upload the module
#   VIAM_KEY_VALUE - corresponding API key value

name: Deploy

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # viamrobotics/build-action@v1.7.3
      - uses: viamrobotics/build-action@b885e11b378e05476ee0109c9fc8ecb387b508e2
        with:
          version: ${{ github.ref_name }}
          ref: ${{ github.sha }}
          key-id: ${{ secrets.VIAM_KEY_ID }}
          key-value: ${{ secrets.VIAM_KEY_VALUE }}
          token: ${{ github.token }}
          do-update: false
